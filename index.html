<title>LFC Matchday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column of three scoreboard panels on a Liverpool red with gold; single committed look */
:root {
  --bg-top: #c8102e;
  --bg-bot: #1c0207;
  --panel: rgba(28, 2, 7, .6);
  --line: rgba(255, 255, 255, .14);
  --ink: #ffffff;
  --muted: #ecc7cc;
  --orange: #f6eb61;
  --win: #45c97f;
  --loss: #ff6b5b;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg-bot); }
html, body { margin: 0; min-height: 100%; }
body {
  background: linear-gradient(180deg, var(--bg-top) 0%, #7a0a1c 50%, var(--bg-bot) 100%) fixed, var(--bg-bot);
  color: var(--ink); font: 16px/1.4 var(--body); min-height: 100vh;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding-block: 4px 6px; }
h1 { min-width: 0; font: 800 clamp(26px, 8vw, 34px)/1 var(--display); letter-spacing: .03em; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 10px; }
h1 img { width: 34px; height: 34px; border-radius: 8px; }
h1 span { background: var(--orange); color: #7a0a1c; padding: 2px 8px 0; border-radius: 6px; }
button {
  font: 700 13px var(--body); color: #c8102e; background: #fff; border: 0;
  border-radius: 999px; padding: 8px 14px; cursor: pointer; flex-shrink: 0;
}
button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid rgba(246,235,97,.55); box-shadow: inset 0 3px 0 var(--orange); border-radius: 14px; padding: 16px; }
.label {
  font: 700 13px var(--display); letter-spacing: .16em; text-transform: uppercase; color: #fff;
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  border-left: 4px solid var(--orange); padding-left: 8px;
}
.live { color: var(--loss); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.team { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.team img { width: 44px; height: 44px; object-fit: contain; }
.team .abbr { font: 700 15px var(--display); letter-spacing: .06em; }
.pts { font: 800 54px/1 var(--display); font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }
.pts.dim { opacity: .6; color: var(--ink); }
.mid { font: 700 14px var(--display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; text-align: center; }
.foot { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
.badge { font: 800 15px var(--display); letter-spacing: .08em; padding: 2px 8px; border-radius: 6px; color: #fff; }
.badge.w { background: var(--win); color: #062a17; } .badge.d { background: #d9d9de; color: #222; } .badge.l { background: var(--loss); color: #3a0a05; }
.record { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.record .big { font: 800 52px/1 var(--display); font-variant-numeric: tabular-nums; }
.record .sub { color: var(--muted); font-size: 15px; }
.next-opp { display: flex; align-items: center; gap: 12px; }
.next-opp img { width: 40px; height: 40px; object-fit: contain; }
.next-opp .who { font: 700 24px/1.1 var(--display); }
.next-opp .when { color: var(--muted); font-size: 15px; }
.watch { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.watch a {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink); border: 1px solid rgba(246,235,97,.8); border-radius: 10px; padding: 10px 12px;
  background: rgba(200,16,46,.75);
}
.watch a strong { font-weight: 600; }
.watch a small { color: var(--muted); font-size: 13px; }
.watch a .go { color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; }
.note { font-size: 13px; color: var(--muted); margin-top: 6px; }
.err { color: #ffd2cc; font-size: 15px; }
.err strong { color: #fff; display: block; margin-bottom: 4px; }
.pos { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.pos .big { font: 800 52px/1 var(--display); color: var(--orange); }
.pos .sub { color: var(--muted); font-size: 15px; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.tbl th { font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 0 6px 6px; }
.tbl th:nth-child(2) { text-align: left; }
.tbl td { padding: 7px 6px; text-align: right; border-top: 1px solid rgba(255,255,255,.1); }
.tbl td:first-child { width: 2.2em; color: var(--muted); }
.tbl td:nth-child(2) { text-align: left; width: 100%; }
.tbl td:nth-child(2) span { display: flex; align-items: center; gap: 8px; }
.tbl td img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
.tbl td:last-child { font-weight: 700; }
.tbl tr.me td { background: rgba(246,235,97,.18); color: #fff; font-weight: 700; }
.tbl tr.me td:first-child { box-shadow: inset 4px 0 0 var(--orange); color: #fff; }
.tbl tr.gap td { text-align: center !important; color: var(--muted); padding: 2px; border: 0; }
.more { margin-top: 10px; background: none !important; color: var(--orange) !important; border: 1px solid rgba(246,235,97,.6) !important; width: 100%; }
.stamp { text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>

<script>
const BASE = "https://site.api.espn.com/apis/site/v2/sports/soccer";
const TEAM_ID = "364";        // ESPN id for Liverpool
const LEAGUES = [
  { k: "eng.1", n: "Premier League" },
  { k: "uefa.champions", n: "Champions League" },
  { k: "eng.fa", n: "FA Cup" },
  { k: "eng.league_cup", n: "Carabao Cup" }
];
const TZ = "America/New_York";
let liveTimer = null;

// ESPN serves the same data from two hosts; try the backup if the first fails
const HOSTS = ["https://site.api.espn.com", "https://site.web.api.espn.com"];
async function getJSON(url) {
  let lastErr;
  for (const host of HOSTS) {
    try {
      const u = url.replace("https://site.api.espn.com", host);
      const r = await fetch(u + (u.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const comp = ev => (ev && ev.competitions && ev.competitions[0]) || {};
const statusOf = ev => ev?.status || comp(ev)?.status || {};
const state = ev => statusOf(ev).type?.state || "";
const isLFC = c => String(c?.team?.id) === TEAM_ID || c?.team?.abbreviation === "LIV";
const hasLFC = ev => (comp(ev).competitors || []).some(isLFC);
const scoreOf = c => {
  if (c?.score == null) return "–";
  return typeof c.score === "object" ? (c.score.displayValue ?? c.score.value ?? "–") : c.score;
};
const logoOf = t => t?.logo || (t?.logos && t.logos[0]?.href) || "";

function fmtDate(iso, withTime = true) {
  const d = new Date(iso);
  const opts = { timeZone: TZ, weekday: "short", month: "short", day: "numeric" };
  if (withTime) { opts.hour = "numeric"; opts.minute = "2-digit"; }
  return d.toLocaleString("en-US", opts) + (withTime ? " ET" : "");
}

function showError(err) {
  const local = !/^https?:$/.test(location.protocol);
  const msg = local
    ? `<strong>Can't get scores from the saved file.</strong>Your iPhone blocks a saved file from reaching the internet. Open this page from its web link instead (the GitHub Pages step) and it will load.`
    : `<strong>Couldn't reach ESPN.</strong>Check your connection and tap Refresh. (${esc(err && err.message || "network error")})`;
  document.getElementById("gameLabel").className = "label";
  document.getElementById("gameLabel").textContent = "Latest match";
  ["gameBody", "recordBody", "nextBody"].forEach((id, i) => {
    const el = document.getElementById(id);
    el.classList.remove("dim");
    el.innerHTML = i === 0 ? `<div class="err">${msg}</div>` : `<span class="dim">Waiting on the connection above.</span>`;
  });
}

function teamCell(c) {
  const t = c.team || {};
  const logo = logoOf(t);
  return `<div class="team">${logo ? `<img src="${esc(logo)}" alt="">` : ""}<span class="abbr">${esc(t.shortDisplayName || t.abbreviation || t.displayName)}</span></div>`;
}

function resultOf(ev) {
  const cs = comp(ev).competitors || [];
  const me = cs.find(isLFC), opp = cs.find(x => x !== me);
  if (!me || !opp) return null;
  if (me.winner === true) return "W";
  if (opp.winner === true) return "L";
  const a = Number(scoreOf(me)), b = Number(scoreOf(opp));
  if (isNaN(a) || isNaN(b)) return null;
  return a > b ? "W" : a < b ? "L" : "D";
}

function renderGame(ev, live) {
  const label = document.getElementById("gameLabel");
  const body = document.getElementById("gameBody");
  body.classList.remove("dim");
  if (!ev) { label.textContent = "Latest match"; body.innerHTML = `<span class="dim">No matches played yet this season.</span>`; return; }
  const c = comp(ev);
  const cs = c.competitors || [];
  const home = cs.find(x => x.homeAway === "home") || cs[0];
  const away = cs.find(x => x.homeAway === "away") || cs[1];
  const st = statusOf(ev);

  if (live) {
    label.className = "label live";
    label.textContent = "Live now";
  } else {
    label.className = "label";
    const r = resultOf(ev);
    const cls = r === "W" ? "w" : r === "L" ? "l" : "d";
    label.innerHTML = `Latest match ${r ? `<span class="badge ${cls}">${r}</span>` : ""}`;
  }
  const ptsClass = side => (live || isLFC(side)) ? "pts" : "pts dim";
  const mid = esc(st.type?.shortDetail || (live ? "Live" : "FT"));
  body.innerHTML = `
    <div class="board">
      ${teamCell(home)}
      <div class="mid">v</div>
      ${teamCell(away)}
      <div class="${ptsClass(home)}" style="text-align:center">${esc(scoreOf(home))}</div>
      <div class="mid">${mid}</div>
      <div class="${ptsClass(away)}" style="text-align:center">${esc(scoreOf(away))}</div>
    </div>
    <div class="foot">${esc(ev._comp || "")} · ${esc(fmtDate(ev.date, false))}${c.venue?.fullName ? " · " + esc(c.venue.fullName) : ""}</div>`;
}

function renderRecord(plEvents, teamData) {
  const body = document.getElementById("recordBody");
  body.classList.remove("dim");
  let w = 0, d = 0, l = 0;
  plEvents.filter(e => statusOf(e).type?.completed).forEach(e => {
    const r = resultOf(e);
    if (r === "W") w++; else if (r === "D") d++; else if (r === "L") l++;
  });
  const pts = w * 3 + d;
  const parts = [`${pts} pts`, `${w + d + l} played`];
  body.innerHTML = `<div class="record"><span class="big">${w}-${d}-${l}</span><span class="sub">W-D-L · ${parts.join(" · ")}</span></div>`;
}

// Map a US TV network to where it streams
function streamFor(name) {
  const n = name.toUpperCase();
  if (n.includes("PEACOCK") || n === "NBC" || n.includes("NBC ")) return { svc: "Peacock", url: "https://www.peacocktv.com/" };
  if (n.includes("USA")) return { svc: "USA Network (NBC Sports app)", url: "https://www.nbcsports.com/watch" };
  if (n.includes("PARAMOUNT") || n.includes("CBS")) return { svc: "Paramount+", url: "https://www.paramountplus.com/" };
  if (n.includes("ESPN") || n === "ABC") return { svc: "ESPN app", url: "https://www.espn.com/watch/" };
  if (n.includes("TELEMUNDO") || n.includes("UNIVERSO")) return { svc: "Peacock (Spanish)", url: "https://www.peacocktv.com/" };
  if (n.includes("UNIMAS") || n.includes("TUDN") || n.includes("VIX")) return { svc: "ViX (Spanish)", url: "https://vix.com/" };
  if (n.includes("DAZN")) return { svc: "DAZN", url: "https://www.dazn.com/" };
  return null;
}

function networksOf(ev) {
  const c = comp(ev);
  const out = [];
  const add = (name, market) => {
    if (!name || out.some(o => o.name === name)) return;
    out.push({ name, national: String(market || "").toLowerCase().includes("national") });
  };
  (c.broadcasts || []).forEach(b => {
    if (Array.isArray(b.names)) b.names.forEach(n => add(n, b.market));
    else add(b.media?.shortName || b.media?.name, b.market?.type || b.market);
  });
  (c.geoBroadcasts || []).forEach(g => add(g.media?.shortName, g.market?.type));
  return out;
}

const FALLBACK = {
  "Premier League": "Premier League matches stream on Peacock or air on NBC / USA Network.",
  "Champions League": "Champions League matches stream on Paramount+.",
  "Carabao Cup": "Carabao Cup matches stream on Paramount+.",
  "FA Cup": "FA Cup matches stream on the ESPN app."
};

function renderNext(ev) {
  const body = document.getElementById("nextBody");
  body.classList.remove("dim");
  if (!ev) { body.innerHTML = `<span class="dim">No upcoming match on the schedule.</span>`; return; }
  const c = comp(ev);
  const cs = c.competitors || [];
  const me = cs.find(isLFC);
  const opp = cs.find(x => x !== me) || {};
  const atHome = me?.homeAway === "home";
  const ot = opp.team || {};
  const logo = logoOf(ot);
  const nets = networksOf(ev);

  let watch = "";
  if (nets.length) {
    watch = `<div class="watch">` + nets.map(n => {
      const s = streamFor(n.name);
      return s
        ? `<a href="${s.url}" target="_blank" rel="noopener"><span><strong>${esc(s.svc)}</strong>${s.svc.toUpperCase().includes(n.name.toUpperCase()) ? "" : `<br><small>${esc(n.name)}</small>`}</span><span class="go">Open ›</span></a>`
        : `<a href="https://www.google.com/search?q=${encodeURIComponent(n.name + " streaming")}" target="_blank" rel="noopener"><span><strong>${esc(n.name)}</strong></span><span class="go">Find ›</span></a>`;
    }).join("") + `</div>`;
  } else {
    watch = `<div class="note">Broadcast not announced yet. ${esc(FALLBACK[ev._comp] || "")}</div>`;
  }

  body.innerHTML = `
    <div class="next-opp">
      ${logo ? `<img src="${esc(logo)}" alt="">` : ""}
      <div style="min-width:0">
        <div class="who">${atHome ? "vs" : "at"} ${esc(ot.displayName || ot.shortDisplayName || "TBD")}</div>
        <div class="when">${esc(ev._comp || "")} · ${esc(fmtDate(ev.date))}${c.venue?.fullName ? " · " + esc(c.venue.fullName) : ""}</div>
      </div>
    </div>${watch}`;
}

// Premier League table: Liverpool's position plus a compact table
let tableOpen = false;
function standingsEntries(j) {
  if (!j) return [];
  const pick = o => o?.standings?.entries || [];
  let entries = pick(j);
  if (!entries.length && Array.isArray(j.children)) entries = j.children.flatMap(pick);
  const stat = (e, ...names) => {
    for (const n of names) {
      const s = (e.stats || []).find(x => x.name === n || x.abbreviation === n || x.type === n);
      if (s) return s.value ?? Number(s.displayValue);
    }
    return null;
  };
  return entries.map((e, i) => ({
    team: e.team || {},
    rank: stat(e, "rank") ?? i + 1,
    played: stat(e, "gamesPlayed", "GP"),
    gd: stat(e, "pointDifferential", "GD"),
    pts: stat(e, "points", "P"),
    w: stat(e, "wins", "W"), d: stat(e, "ties", "D"), l: stat(e, "losses", "L")
  })).sort((a, b) => a.rank - b.rank);
}
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

function renderTable(j) {
  const body = document.getElementById("tableBody");
  body.classList.remove("dim");
  const rows = standingsEntries(j);
  if (!rows.length) { body.innerHTML = `<span class="dim">Table not available right now. Tap Refresh.</span>`; return; }
  const me = rows.find(r => String(r.team.id) === TEAM_ID);
  const gd = v => v == null ? "–" : (v > 0 ? "+" + v : String(v));
  const row = r => `<tr class="${String(r.team.id) === TEAM_ID ? "me" : ""}">
      <td>${r.rank}</td>
      <td><span>${logoOf(r.team) ? `<img src="${esc(logoOf(r.team))}" alt="">` : ""}${esc(r.team.shortDisplayName || r.team.displayName)}</span></td>
      <td>${r.played ?? "–"}</td><td>${gd(r.gd)}</td><td>${r.pts ?? "–"}</td></tr>`;

  // Collapsed: top 5, plus Liverpool and its neighbours if they're lower down
  let shown;
  if (tableOpen) shown = rows.map(row).join("");
  else {
    const top = rows.slice(0, 5);
    const idx = me ? rows.indexOf(me) : -1;
    if (idx < 7) shown = rows.slice(0, Math.max(5, idx + 2)).map(row).join("");
    else shown = top.map(row).join("") + `<tr class="gap"><td colspan="5">⋯</td></tr>` + rows.slice(idx - 1, idx + 2).map(row).join("");
  }
  const leader = rows[0];
  let gapText = "";
  if (me && leader && me !== leader && me.pts != null && leader.pts != null) gapText = `${leader.pts - me.pts} pts behind ${esc(leader.team.shortDisplayName || leader.team.displayName)}`;
  else if (me && rows[1] && me === leader && me.pts != null && rows[1].pts != null) gapText = `${me.pts - rows[1].pts} pts clear at the top`;

  body.innerHTML = `
    ${me ? `<div class="pos"><span class="big">${ord(me.rank)}</span><span class="sub">${me.pts ?? "–"} pts${gapText ? " · " + gapText : ""}</span></div>` : ""}
    <table class="tbl"><thead><tr><th>#</th><th>Club</th><th>P</th><th>GD</th><th>Pts</th></tr></thead><tbody>${shown}</tbody></table>
    <button type="button" class="more" id="tableToggle">${tableOpen ? "Show less" : "Show full table"}</button>`;
  document.getElementById("tableToggle").onclick = () => { tableOpen = !tableOpen; renderTable(j); };
}

async function load() {
  clearTimeout(liveTimer);
  const btn = document.getElementById("refresh");
  btn.textContent = "Updating…";
  try {
    const jobs = [];
    LEAGUES.forEach(L => {
      jobs.push(getJSON(`${BASE}/${L.k}/teams/${TEAM_ID}/schedule`).then(j => ({ L, kind: "results", j })));
      jobs.push(getJSON(`${BASE}/${L.k}/teams/${TEAM_ID}/schedule?fixture=true`).then(j => ({ L, kind: "fixtures", j })));
      jobs.push(getJSON(`${BASE}/${L.k}/scoreboard`).then(j => ({ L, kind: "board", j })));
    });
    const teamJob = getJSON(`${BASE}/eng.1/teams/${TEAM_ID}`);
    const tableJob = getJSON(`https://site.api.espn.com/apis/v2/sports/soccer/eng.1/standings`);
    const settled = await Promise.allSettled(jobs);
    const teamR = await Promise.allSettled([teamJob]).then(r => r[0]);
    const ok = settled.filter(r => r.status === "fulfilled").map(r => r.value);
    if (!ok.length) throw (settled[0] && settled[0].reason) || new Error("no data");

    // Merge every match by id; scoreboard copies are freshest, so they win
    const byId = new Map();
    const plIds = new Set();
    ok.sort((a, b) => (a.kind === "board") - (b.kind === "board"));
    ok.forEach(({ L, kind, j }) => {
      (j.events || []).forEach(ev => {
        if (!hasLFC(ev)) return;
        ev._comp = L.n;
        if (L.k === "eng.1" && kind !== "board") plIds.add(ev.id);
        byId.set(ev.id, ev);
      });
    });
    const events = [...byId.values()].sort((a, b) => new Date(a.date) - new Date(b.date));

    const live = events.find(e => state(e) === "in");
    const done = events.filter(e => statusOf(e).type?.completed);
    const last = done[done.length - 1];
    const next = events.find(e => state(e) === "pre" && new Date(e.date) > Date.now() - 3 * 3600e3);
    const plEvents = events.filter(e => plIds.has(e.id));

    const safe = (id, fn) => { try { fn(); } catch (e) {
      const el = document.getElementById(id); el.classList.add("dim"); el.textContent = "Couldn't read this part of ESPN's data. Tap Refresh.";
    } };
    safe("gameBody", () => renderGame(live || last, !!live));
    safe("recordBody", () => renderRecord(plEvents, teamR.status === "fulfilled" ? teamR.value : null));
    safe("nextBody", () => renderNext(next));
    const tableR = await Promise.allSettled([tableJob]).then(r => r[0]);
    safe("tableBody", () => renderTable(tableR.status === "fulfilled" ? tableR.value : null));

    document.getElementById("stamp").textContent = "Updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + (live ? " · refreshing every 30s" : "");
    if (live) liveTimer = setTimeout(load, 30000);
  } catch (err) {
    showError(err);
  } finally {
    btn.textContent = "Refresh";
  }
}

document.getElementById("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
window.addEventListener("pageshow", e => { if (e.persisted) load(); });
load();
</script>
</body>
